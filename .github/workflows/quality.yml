name: Quality Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, schema, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      APP_ENV: ci
      RELEASE_ID: ci-${{ github.sha }}
      DATABASE_URL: mysql://vpp_ci:vpp_ci@127.0.0.1:3306/vpp_ci
      NEXTAUTH_SECRET: phase-eight-ci-secret-that-is-not-used-outside-ci
      NEXTAUTH_URL: http://127.0.0.1:3000
      SEED_PASSWORD: phase-eight-ci-password
      UPLOAD_DIR: ./storage/uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js compiler output
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify

      - name: Validate runtime configuration contract
        run: npm run runtime:validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build provider-neutral container artifact
        run: docker build --build-arg RELEASE_ID=${{ github.sha }} --tag vpp:${{ github.sha }} .
